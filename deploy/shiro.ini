# Render's proxy reaches the container from localhost, so Fuseki's default
# localhost-only rule would let anyone use the admin API. Block it for everyone.
[main]
localhostFilter=org.apache.jena.fuseki.authz.LocalhostFilter

[users]
# no users: authcBasic below can never succeed

[urls]
/$/ping     = anon
/$/status   = anon
/$/server   = anon
# dataset list for the web UI (GET); creating datasets is still possible here, accepted risk on a free instance
/$/datasets = anon
/$/** = authcBasic, roles[admin]
/**   = anon
